<!DOCTYPE html>
<html lang="id">
<head>

<title>Biodata Profil Diri</title>
<style>
body{

    background:#e2cfeb;

    height:100vh;
    margin:0;

.card{

}
.header img{
    width:65px;
    height:65px;
    border-radius:50%;
    border:2px solid #444;
    object-fit:cover;
    margin-right:15px;
}
.title{
    flex:1;
    text-align:center;
}
table{
    width:100%;
    font-size:14px;
}
td{
    padding:6px 0;
}
.label{
  width:140px
}
.kotak{
  width:10px
}
</style>
</head>
<body>
<div class="card">

        <img src="jil.jpg">
        <div class="title">
            <h1>Azzizul or Jijul</h1>
        </div>
    </div>
    <table>
        <tr><td class="label">
          <b>Nama Lengkap</b></td>
        <td class="kotak">:</td>
        <td>Azzizul Fa'idzahra</td></tr>
        <tr><td class="label">
          <b>Absen / Kelas</b></td>
        <td class="kotak">:</td>
        <td>08 / X RPL 2</td></tr>
        <tr><td class="label">
          <b>Hobby</b></td>

        <tr><td class="label">

    </table>
</div>
</body>
</html>
