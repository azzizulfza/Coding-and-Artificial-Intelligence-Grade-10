<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdecef;
        }

        .container {
            width: 360px;
            margin: 60px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #000;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #000;
        }

        input {
            width: 100%;
            height: 38px;
            padding: 8px;
            margin: 6px 0 15px;
            border-radius: 6px;
            border: 1px solid #f3b6c2;
            box-sizing: border-box;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 10px;
            background-color: #f3b6c2;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #e6a1b1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Pendaftaran</h2>

    <label>Username</label>
    <input type="text">

    <label>Password</label>
    <input type="password">

    <label>Email</label>
    <input type="email">

    <a href="informasi.html" class="btn">Lanjut</a>
</div>

</body>
</html>
