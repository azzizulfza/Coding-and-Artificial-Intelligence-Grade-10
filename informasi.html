<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Informasi Pribadi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdecef;
        }

        .container {
            width: 360px;
            margin: 60px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #000;
        }

        label {
            font-weight: bold;
            color: #000;
        }

        input, select, textarea {
            width: 100%;
            height: 38px;
            padding: 8px;
            margin: 6px 0 15px;
            border-radius: 6px;
            border: 1px solid #f3b6c2;
            box-sizing: border-box;
        }

        textarea {
            height: 70px;
            resize: none;
        }

        /* RADIO BULLET KE BAWAH */
        .option {
            margin: 8px 0 15px;
        }

        .option label {
            display: block;
            font-weight: normal;
            margin-bottom: 6px;
        }

        .option input {
            width: auto;
            height: auto;
            margin-right: 6px;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 10px;
            background-color: #f3b6c2;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #e6a1b1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Informasi Pribadi</h2>

    <label>Nama Lengkap</label>
    <input type="text">

    <label>Jenis Kelamin</label>
    <div class="option">
        <label><input type="radio" name="gender"> Laki-laki</label>
        <label><input type="radio" name="gender"> Perempuan</label>
    </div>

    <label>Tempat Lahir</label>
    <input type="text">

    <label>Tanggal Lahir</label>
    <input type="date">

    <label>Kelas</label>
    <select>
        <option>-- Pilih --</option>
        <option>X</option>
        <option>XI</option>
        <option>XII</option>
    </select>

    <label>Jurusan</label>
    <select>
        <option>-- Pilih --</option>
        <option>RPL</option>
        <option>TKJ</option>
        <option>DKV</option>
        <option>Kuliner</option>
        <option>Perhotelan</option>
        <option>Animasi</option>
    </select>

    <label>Alamat</label>
    <textarea></textarea>

    <a href="berhasil.html" class="btn">Simpan</a>
</div>

</body>
</html>
